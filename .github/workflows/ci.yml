name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # npm test runs app/tools/check-operator-session.mjs when it is present, and that tool imports vite from app/node_modules.
      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2
      - run: pnpm --dir app install --frozen-lockfile
      - run: npm test
      # Offline self-tests that npm test does not reach: the release agent (I3b), the NYC validators' refusals
      # and the demo-readiness judge.
      - run: node src/desk/audit.mjs --self-test
      - run: node src/dev/check-nyc-contracts.mjs --self-test
      - run: node src/dev/check-demo-ready.mjs --nyc --self-test

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12.11.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
